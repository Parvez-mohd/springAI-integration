spring.application.name=firstspringai
server.port=8081

# Resilience4j
resilience4j.circuitbreaker.instances.openLibraryService.sliding-window-size=5
resilience4j.circuitbreaker.instances.openLibraryService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.openLibraryService.wait-duration-in-open-state=10s

# Spring AI - OpenAI & Ollama
spring.ai.openai.api-key=API_SECRET
spring.ai.openai.chat.options.model=gpt-4o
spring.ai.openai.chat.options.temperature=0.7

spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.options.model=llama3.2

# Logging
logging.level.org.springframework.ai.chat.client.advisor=DEBUG

# MariaDB Datasource
spring.datasource.url=jdbc:mariadb://localhost:3308/springai
spring.datasource.username=root
spring.datasource.password=root1234
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

spring.ai.vectorstore.mariadb.initialize-schema=true
spring.ai.vectorstore.mariadb.distance-type=COSINE
spring.ai.vectorstore.mariadb.dimensions=1024