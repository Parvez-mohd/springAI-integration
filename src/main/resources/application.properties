spring.application.name=firstspringai
server.port=8081
spring.profiles.active=local

# Resilience4j
resilience4j.circuitbreaker.instances.openLibraryService.sliding-window-size=5
resilience4j.circuitbreaker.instances.openLibraryService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.openLibraryService.wait-duration-in-open-state=10s

# Groq Cloud API - Explicitly Set Chat Key & Base URL
spring.ai.openai.api-key=KEY
spring.ai.openai.base-url=https://api.groq.com/openai
spring.ai.openai.chat.options.model=openai/gpt-oss-120b
spring.ai.openai.chat.options.temperature=0.7

# Disable OpenAI auto-configured features that Groq does not support
spring.ai.openai.embedding.enabled=false

# Logging
logging.level.org.springframework.ai.chat.client.advisor=DEBUG

# MariaDB Datasource
spring.datasource.url=jdbc:mariadb://localhost:3308/springai
spring.datasource.username=root
spring.datasource.password=root1234
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# MariaDB Vector Store (Using local Transformers ONNX embeddings - 384 dimensions)
spring.ai.vectorstore.mariadb.initialize-schema=true
spring.ai.vectorstore.mariadb.distance-type=COSINE
spring.ai.vectorstore.mariadb.dimensions=384